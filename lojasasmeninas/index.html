<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja das Meninas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header> 
        <h1>Loja das Meninas</h1>
    </header>

    <div class="container">

        <div class="card">
            <div class="produto">
                <img src="base.img" alt="Base de maquiagem">
                <h2>Base</h2>
                <p class="descricao">Ideal para mulheres e homens</p>
                <p class="preco">R$ 355,00</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <div class="produto">
                <img src="contorno.img" alt="Contorno facial">
                <h2>Contorno</h2>
                <p class="descricao">Ideal para mulheres e homens</p>
                <p class="preco">R$ 200,00</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <div class="produto">
                <img src="batom.img" alt="Batom">
                <h2>Batom</h2>
                <p class="descricao">Ideal para mulheres e homens</p>
                <p class="preco">R$ 100,00</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <div class="produto">
                <img src="iluminador.img" alt="iluminador">
                <h2>iluminador</h2>
                <p class="descricao">Ideal para mulheres e homens</p>
                <p class="preco">R$ 250,00</p>
                <button>Comprar</button>
            </div>
        </div>

    </div> 

</body>
</html>
